version: '3.9'

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: SQLServer-Container
    environment:
      SA_PASSWORD: ${DB_PASSWORD}
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"
    volumes:
      - sqlserverdata:/var/opt/mssql
    restart: unless-stopped
    networks:
      - ftareqi-network
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"${DB_PASSWORD}\" -Q 'SELECT 1' -No"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  redis:
    image: redis:latest
    container_name: Redis-Container
    ports:
      - "6379:6379"
    restart: unless-stopped
    networks:
      - ftareqi-network

  ftareqi.api:
    container_name: FtareqiAPI-container
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__DefaultConnection=Server=sqlserver;Database=${DB_NAME};User Id=sa;Password=${DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;
      - ConnectionStrings__HangfireConnection=Server=sqlserver;Database=${HANGFIRE_DB_NAME};User Id=sa;Password=${HANGFIRE_DB_PASSWORD};TrustServerCertificate=True;MultipleActiveResultSets=True;
      - ConnectionStrings__RedisConnection=${REDIS_CONNECTION}
      - JWTSettings__SignInKey=${JWT_SIGNIN_KEY}
      - JWTSettings__Audience=${JWT_AUDIENCE}
      - JWTSettings__Issuer=${JWT_ISSUER}
      - JWTSettings__AccessTokenExpiryInMinutes=${JWT_ACCESS_TOKEN_EXPIRY_IN_MINUTES}
      - CloudinarySettings__CloudName=${CLOUDINARY_CLOUD_NAME}
      - CloudinarySettings__ApiKey=${CLOUDINARY_API_KEY}
      - CloudinarySettings__ApiSecret=${CLOUDINARY_API_SECRET}
      - PaymobSettings__HMAC=${PAYMOB_HMAC}
      - PaymobSettings__APIKey=${PAYMOB_API_KEY}
      - PaymobSettings__MerchantID=${PAYMOB_MERCHANT_ID}
      - PaymobSettings__CardIntegrationId=${PAYMOB_CARD_INTEGRATION_ID}
      - PaymobSettings__IframeId=${PAYMOB_IFRAME_ID}
      - PaymobSettings__WalletIntegrationId=${PAYMOB_WALLET_INTEGRATION_ID}
      - FirebaseSettings__ProjectId=${FIREBASE_PROJECT_ID}
      - FirebaseSettings__PrivateKeyId=${FIREBASE_PRIVATE_KEY_ID}
      - FirebaseSettings__PrivateKey=${FIREBASE_PRIVATE_KEY}
      - FirebaseSettings__ClientEmail=${FIREBASE_CLIENT_EMAIL}
      - FirebaseSettings__ClientId=${FIREBASE_CLIENT_ID}
      - FirebaseSettings__AuthUri=${FIREBASE_AUTH_URI}
      - FirebaseSettings__TokenUri=${FIREBASE_TOKEN_URI}
      - FirebaseSettings__AuthProviderX509CertUrl=${FIREBASE_AUTH_PROVIDER_X509_CERT_URL}
      - FirebaseSettings__ClientX509CertUrl=${FIREBASE_CLIENT_X509_CERT_URL}
      - Serilog__WriteTo__2__Args__configure__0__Args__serverUrl=http://seq:80
      - TwilioSettings__AccountSID=${TWILIO_ACCOUNT_SID}
      - TwilioSettings__AuthToken=${TWILIO_AuthToken}
      - TwilioSettings__PhoneNumber=${TWILIO_PHONE_NUMBER}
      - OTEL_EXPORTER_OTLP_ENDPOINT=${OTEL_EXPORTER_OTLP_ENDPOINT}
    ports:
      - "5342:8080"
    depends_on:
      sqlserver:
        condition: service_healthy
      redis:
        condition: service_started
      seq:
        condition: service_started
    networks:
      - ftareqi-network
    restart: on-failure

  seq:
    image: datalust/seq:latest
    container_name: Seq-Container
    environment:
      - ACCEPT_EULA=Y
      - SEQ_FIRSTRUN_NOAUTHENTICATION=True
    ports:
      - "5300:80"
    volumes:
      - seq-data:/data
    restart: unless-stopped
    networks:
      - ftareqi-network

  prometheus:
    image: prom/prometheus:latest
    container_name: Prometheus-Container
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    restart: unless-stopped
    networks:
      - ftareqi-network

  jaeger:
    image: jaegertracing/all-in-one:latest
    container_name: Jaeger-Container
    ports:
      - "16686:16686"
      - "4317:4317"
    networks:
      - ftareqi-network

volumes:
  sqlserverdata:
  seq-data:

networks:
  ftareqi-network:
    driver: bridge